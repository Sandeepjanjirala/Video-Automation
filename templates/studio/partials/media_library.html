<!-- Reusable Media Library & Stock Modal -->
<div id="media-library-modal" class="modalback" style="display:none;">
  <div class="modal wide">
    <div class="sectionhead">
      <h2>Media library &amp; footage manager</h2>
      <button type="button" id="btn-close-media-modal" class="ghost" style="font-size:16px;">&times;</button>
    </div>

    <!-- Upload Section -->
    <div style="background:#fbfcf8;border:1px solid var(--line);border-radius:8px;padding:16px;margin:16px 0;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <b>Upload video, image or audio</b>
          <p class="muted" style="margin:2px 0 0 0;font-size:11px;">Files are streamed directly to local storage and verified with ffprobe.</p>
        </div>
        <label class="filebutton primary" style="margin:0;">
          Select file
          <input type="file" id="file-upload-media" accept="video/*,audio/*,image/jpeg,image/png,image/webp">
        </label>
      </div>
      <div id="media-upload-status" style="margin-top:10px;font-size:12px;display:none;"></div>
    </div>

    <!-- Stock Footage Search -->
    <div style="margin:16px 0;">
      <span style="font-size:12px;font-weight:600;">Search free stock footage:</span>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <select id="library-stock-provider" aria-label="Stock provider"><option value="auto">Pixabay first</option><option value="pixabay">Pixabay</option><option value="pexels">Pexels</option></select>
        <input type="text" id="input-stock-search" placeholder="e.g. Hyderabad, nature, technology, urban rain...">
        <button type="button" id="btn-stock-search" class="ghost">Search stock</button>
      </div>
      <p class="muted">Footage from <a href="https://pixabay.com" target="_blank" rel="noopener noreferrer">Pixabay</a> and <a href="https://www.pexels.com" target="_blank" rel="noopener noreferrer">Pexels</a>. Review each clip before use.</p>
      <div id="stock-results-grid" class="stockgrid" style="display:none;"></div>
    </div>

    <!-- Library Assets Grid -->
    <div style="margin-top:20px;">
      <span style="font-size:12px;font-weight:600;">Project assets &amp; library clips:</span>
      <div id="media-assets-grid" class="mediagrid">
        <!-- Rendered by StudioMedia.renderLibraryGrid -->
      </div>
    </div>
  </div>
</div>
