{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#204d3d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reel Studio">
  <title>{% block title %}Telugu Reel Studio{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'app.css' %}">
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <link rel="icon" href="{% static 'icon.svg' %}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{% static 'icon-192.png' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Pinned Local jQuery 3.7.1 -->
  <script src="{% static 'vendor/jquery.min.js' %}"></script>

  <!-- Modular jQuery & API Handlers -->
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/state.js' %}"></script>
  <script src="{% static 'js/ui.js' %}"></script>
  <script src="{% static 'js/media.js' %}"></script>
  <script src="{% static 'js/voice.js' %}"></script>
  <script src="{% static 'js/workflow.js' %}"></script>
  <script src="{% static 'js/captionstyle.js' %}"></script>
  <script src="{% static 'js/framing.js' %}"></script>
  <script src="{% static 'js/scenes.js' %}"></script>
  <script src="{% static 'js/projects.js' %}"></script>
  <script src="{% static 'js/jobs.js' %}"></script>
  <script src="{% static 'js/captions.js' %}"></script>
  <script src="{% static 'js/autopilot.js' %}"></script>
  <script src="{% static 'js/narration.js' %}"></script>
  <script src="{% static 'js/settings.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
