{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Telugu Reel Studio{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'app.css' %}">
  <link rel="icon" href="data:,">

</head>

</html>
