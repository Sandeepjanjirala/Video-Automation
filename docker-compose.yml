services:
  postgres:
    image: postgres:18-alpine
    container_name: studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-studio}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: studio-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 60 1
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  migrate:
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings
      - STUDIO_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-studio}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: studio-api
    restart: unless-stopped
    env_file:
      # API keys (STUDIO_GEMINI_KEY, STUDIO_PIXABAY_KEY, ...) from .env; values under environment: win.
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings
      - STUDIO_DISTRIBUTED=1
      - STUDIO_DOCKER=1
      # Every browser reaches the container through Docker's network, so all of them sign in with this password.
      - STUDIO_PASSWORD=${STUDIO_PASSWORD:?Set STUDIO_PASSWORD in the .env file next to docker-compose.yml (the password every browser signs in with)}
      - STUDIO_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-studio}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - STUDIO_CACHE_REDIS_URL=redis://redis:6379/2
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  dispatcher:
    build: .
    container_name: studio-dispatcher
    restart: unless-stopped
    env_file:
      # API keys (STUDIO_GEMINI_KEY, STUDIO_PIXABAY_KEY, ...) from .env; values under environment: win.
      - path: .env
        required: false
    command: ["python", "-m", "studio.dispatcher"]
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings
      - STUDIO_DISTRIBUTED=1
      - STUDIO_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-studio}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - STUDIO_CACHE_REDIS_URL=redis://redis:6379/2
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  worker_network:
    build: .
    container_name: studio-worker-network
    restart: unless-stopped
    env_file:
      # API keys (STUDIO_GEMINI_KEY, STUDIO_PIXABAY_KEY, ...) from .env; values under environment: win.
      - path: .env
        required: false
    # 1 network-task slot (conservative for 1-vCPU VPS)
    command: ["python", "-m", "celery", "-A", "studio.celery_app", "worker", "-Q", "network", "-c", "1", "--loglevel=info", "-n", "worker_network@%h"]
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings
      - STUDIO_DISTRIBUTED=1
      - STUDIO_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-studio}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - STUDIO_CACHE_REDIS_URL=redis://redis:6379/2
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker_render:
    build: .
    container_name: studio-worker-render
    restart: unless-stopped
    env_file:
      # API keys (STUDIO_GEMINI_KEY, STUDIO_PIXABAY_KEY, ...) from .env; values under environment: win.
      - path: .env
        required: false
    # 1 render slot
    command: ["python", "-m", "celery", "-A", "studio.celery_app", "worker", "-Q", "render", "-c", "1", "--loglevel=info", "-n", "worker_render@%h"]
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings
      - STUDIO_DISTRIBUTED=1
      - STUDIO_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-studio}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - STUDIO_CACHE_REDIS_URL=redis://redis:6379/2
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  postgres_data:
  redis_data:
